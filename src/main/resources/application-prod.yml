server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none       # 운영은 Flyway 단독 관리 권장
    show-sql: false
  flyway:
    validate-on-migrate: true
    clean-disabled: true   # 운영에서 clean 금지
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.tomy: INFO

chatbot:
  server:
    debug-log-enabled: ${CHATBOT_DEBUG_LOG_ENABLED:false}
